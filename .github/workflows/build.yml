name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK 37
        run: |
          SDKROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "sdk.dir=$SDKROOT" > local.properties
          SDKM="$(ls -d "$SDKROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
          if [ -z "$SDKM" ]; then SDKM="$(command -v sdkmanager || true)"; fi
          echo "sdkroot=$SDKROOT"
          echo "sdkmanager=$SDKM"
          test -n "$SDKM"
          yes | "$SDKM" --licenses
          "$SDKM" "platforms;android-37.0" "build-tools;37.0.0"
          if [ -d "$SDKROOT/platforms/android-37.0" ] && [ ! -e "$SDKROOT/platforms/android-37" ]; then
            ln -s android-37.0 "$SDKROOT/platforms/android-37"
          fi
      - run: chmod +x gradlew
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: Build release APK
        run: ./gradlew :app:assembleRelease --stacktrace
      - run: ls -lh app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: hermes-mobile-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: hermes-mobile-release-apk
          path: app/build/outputs/apk/release/app-release.apk
